<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>动态粒子壁纸</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            overflow: hidden;
            background: #000;
            user-select: none;
            /* 防止拖动时选中文字 */
        }
        canvas {
            display: block;
            cursor: default;
        }
    </style>
</head>
<body>
    <canvas></canvas>
    <script>
        // ==================== 粒子系统常量 ====================
        const PARTICLES_PER_SQUARE_PIXEL = 0.000005;
        const PARTICLE_MIN_SIZE = 1;
        const PARTICLE_MAX_SIZE = 2.5;
        const PARTICLE_MIN_SPEED = 0.25;
        const PARTICLE_MAX_SPEED = 0.5;
        const PARTICLE_MIN_LIFETIME = 3000;
        const PARTICLE_MAX_LIFETIME = 10000;

        // ==================== 连线系统常量 ====================
        const CONNECTION_MAX_DISTANCE = 100;
        const CONNECTION_LINE_WIDTH = 1;
        const MAX_CONNECTIONS_PER_PARTICLE = 4;
        const MAX_TOTAL_CONNECTIONS = 750;

        // ==================== 鼠标引力常量 ====================
        const MOUSE_GRAVITY_RADIUS = 80;
        const MOUSE_GRAVITY_FORCE = -0.1;

        // ==================== 全局变量 ====================
        let particles = [];
        let mouseX = 0;
        let mouseY = 0;

        // ==================== 时间拖动相关 ====================
        let timePos = { x: 0, y: 0 }; // 时间显示位置（右上角基准点）
        let isDragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let isHoveringTime = false;

        // ==================== Canvas 初始化 ====================
        const canvas = document.querySelector("canvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // 重置时间位置到右上角
            if (!isDragging) {
                timePos.x = canvas.width - 25;
                timePos.y = 30;
            }
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ==================== 鼠标事件 ====================
        // 鼠标移动（用于粒子引力 + 时间悬停检测）
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            // 检测是否悬停在时间上
            if (!isDragging) {
                // 获取当前时间字符串的宽度
                const now = new Date();
                const timeStr = formatTime(now);
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const fullTimeStr = `${timeStr}:${seconds}`;
                
                let fontSize = Math.min(canvas.width, canvas.height) * 0.05;
                fontSize = Math.max(36, Math.min(fontSize, 72));
                ctx.font = `500 ${fontSize}px "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif`;
                
                const metrics = ctx.measureText(fullTimeStr);
                const textWidth = metrics.width;
                const textHeight = fontSize;
                
                // 时间区域（从右上角基准点向左延伸）
                const left = timePos.x - textWidth;
                const right = timePos.x;
                const top = timePos.y;
                const bottom = timePos.y + textHeight;
                
                // 检测鼠标是否在时间区域内
                if (mouseX >= left && mouseX <= right && mouseY >= top && mouseY <= bottom) {
                    canvas.style.cursor = 'grab';
                    isHoveringTime = true;
                } else {
                    canvas.style.cursor = 'default';
                    isHoveringTime = false;
                }
            }
        });

        // 鼠标按下
        canvas.addEventListener('mousedown', (e) => {
            if (isHoveringTime) {
                isDragging = true;
                canvas.style.cursor = 'grabbing';
                
                // 计算拖拽偏移量
                const now = new Date();
                const timeStr = formatTime(now);
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const fullTimeStr = `${timeStr}:${seconds}`;
                
                let fontSize = Math.min(canvas.width, canvas.height) * 0.05;
                fontSize = Math.max(36, Math.min(fontSize, 72));
                ctx.font = `500 ${fontSize}px "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif`;
                
                const metrics = ctx.measureText(fullTimeStr);
                const textWidth = metrics.width;
                
                // 计算鼠标相对于时间右上角的偏移
                dragOffsetX = timePos.x - e.clientX;
                dragOffsetY = timePos.y - e.clientY;
            }
        });

        // 鼠标松开
        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                canvas.style.cursor = 'default';
                isHoveringTime = false;
            }
        });

        // 鼠标移出窗口
        window.addEventListener('mouseleave', () => {
            if (isDragging) {
                isDragging = false;
                canvas.style.cursor = 'default';
                isHoveringTime = false;
            }
        });

        // ==================== 工具函数 ====================
        function formatTime(date) {
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        // ==================== 粒子类 ====================
        class Particle {
            constructor() {
                const side = Math.floor(Math.random() * 4);
                switch (side) {
                    case 0: // 上
                        this.x = Math.random() * canvas.width;
                        this.y = -5;
                        break;
                    case 1: // 右
                        this.x = canvas.width + 5;
                        this.y = Math.random() * canvas.height;
                        break;
                    case 2: // 下
                        this.x = Math.random() * canvas.width;
                        this.y = canvas.height + 5;
                        break;
                    case 3: // 左
                        this.x = -5;
                        this.y = Math.random() * canvas.height;
                        break;
                }
                const speed = PARTICLE_MIN_SPEED + Math.random() * (PARTICLE_MAX_SPEED - PARTICLE_MIN_SPEED);
                const angle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.lifetime = PARTICLE_MIN_LIFETIME + Math.random() * (PARTICLE_MAX_LIFETIME - PARTICLE_MIN_LIFETIME);
                this.age = 0;
                this.baseSize = PARTICLE_MIN_SIZE + Math.random() * (PARTICLE_MAX_SIZE - PARTICLE_MIN_SIZE);
            }

            update(deltaTime) {
                // 鼠标引力
                const dx = mouseX - this.x;
                const dy = mouseY - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance <= MOUSE_GRAVITY_RADIUS && distance > 0) {
                    const force = MOUSE_GRAVITY_FORCE * (1 - distance / MOUSE_GRAVITY_RADIUS);
                    this.vx += (dx / distance) * force;
                    this.vy += (dy / distance) * force;
                }

                this.x += this.vx;
                this.y += this.vy;
                this.age += deltaTime;

                const inScreen = (this.x >= -5 && this.x <= canvas.width + 5) &&
                    (this.y >= -5 && this.y <= canvas.height + 5);
                return this.age < this.lifetime && inScreen;
            }

            draw(ctx) {
                const lifeProgress = this.age / this.lifetime;
                const size = Math.min(this.baseSize * (1 + lifeProgress), PARTICLE_MAX_SIZE);
                const opacity = Math.max(0, 1 - lifeProgress);
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ==================== 生成粒子 ====================
        function generateParticles() {
            const count = Math.floor(canvas.width * canvas.height * PARTICLES_PER_SQUARE_PIXEL);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        // ==================== 绘制连线 ====================
        function drawConnections(ctx) {
            const counts = new Array(particles.length).fill(0);
            const connections = [];
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const p1 = particles[i];
                    const p2 = particles[j];
                    const dx = p1.x - p2.x;
                    const dy = p1.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist <= CONNECTION_MAX_DISTANCE &&
                        counts[i] < MAX_CONNECTIONS_PER_PARTICLE &&
                        counts[j] < MAX_CONNECTIONS_PER_PARTICLE &&
                        connections.length < MAX_TOTAL_CONNECTIONS) {
                        connections.push({ p1, p2 });
                        counts[i]++;
                        counts[j]++;
                    }
                }
            }
            connections.forEach(({ p1, p2 }) => {
                const o1 = Math.max(0, 1 - p1.age / p1.lifetime);
                const o2 = Math.max(0, 1 - p2.age / p2.lifetime);
                const grad = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
                grad.addColorStop(0, `rgba(255, 255, 255, ${o1 * 0.5})`);
                grad.addColorStop(1, `rgba(255, 255, 255, ${o2 * 0.5})`);
                ctx.strokeStyle = grad;
                ctx.lineWidth = CONNECTION_LINE_WIDTH;
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            });
        }

        // ==================== 动画循环 ====================
        let lastTime = 0;

        function animate(currentTime) {
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            // ---- 背景 ----
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, "rgb(255, 100, 180)");
            grad.addColorStop(0.5, "rgb(200, 150, 255)");
            grad.addColorStop(1, "rgb(0, 255, 255)");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // ---- 粒子管理 ----
            if (Math.random() < 0.1) generateParticles();
            particles = particles.filter(p => p.update(deltaTime));

            // ---- 绘制连线 & 粒子 ----
            drawConnections(ctx);
            particles.forEach(p => p.draw(ctx));

            // ==================== 时间显示 ====================
            // 如果正在拖拽，更新时间位置
            if (isDragging) {
                timePos.x = mouseX + dragOffsetX;
                timePos.y = mouseY + dragOffsetY;
                
                // 限制时间不能完全拖出屏幕（保留部分可见）
                const now = new Date();
                const timeStr = formatTime(now);
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const fullTimeStr = `${timeStr}:${seconds}`;
                
                let fontSize = Math.min(canvas.width, canvas.height) * 0.05;
                fontSize = Math.max(36, Math.min(fontSize, 72));
                ctx.font = `500 ${fontSize}px "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif`;
                
                const metrics = ctx.measureText(fullTimeStr);
                const textWidth = metrics.width;
                const textHeight = fontSize;
                
                // 防止完全拖出屏幕
                timePos.x = Math.max(textWidth + 10, Math.min(canvas.width - 10, timePos.x));
                timePos.y = Math.max(10, Math.min(canvas.height - textHeight - 10, timePos.y));
            }

            // 获取当前时间
            const now = new Date();
            const timeStr = formatTime(now);
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const fullTimeStr = `${timeStr}:${seconds}`;

            // ---- 字体大小控制 ----
            let fontSize = Math.min(canvas.width, canvas.height) * 0.05;
            fontSize = Math.max(36, Math.min(fontSize, 72));

            // ---- 绘制时间 ----
            ctx.font = `500 ${fontSize}px "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif`;
            ctx.textAlign = 'right';
            ctx.textBaseline = 'top';

            // 如果是悬停或拖拽状态，添加高亮效果
            const isActive = isHoveringTime || isDragging;
            
            // 主文字阴影
            ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 3;

            // 文字描边
            ctx.shadowBlur = 0;
            ctx.lineWidth = isActive ? 3 : 2;
            ctx.strokeStyle = isActive ? 'rgba(255, 255, 255, 0.3)' : 'rgba(0, 0, 0, 0.15)';
            ctx.strokeText(fullTimeStr, timePos.x, timePos.y);

            // 主文字填充
            ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
            ctx.shadowBlur = isActive ? 25 : 15;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 3;
            ctx.fillStyle = isActive ? 'rgba(255, 255, 255, 1)' : 'rgba(255, 255, 255, 0.9)';
            ctx.fillText(fullTimeStr, timePos.x, timePos.y);

            // ---- 如果悬停或拖拽，显示提示 ----
            if (isActive) {
                // 在时间下方显示小提示
                const hintFontSize = fontSize * 0.25;
                ctx.font = `${hintFontSize}px "SF Pro Display", Arial, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                const hintText = isDragging ? '✦ 拖动中' : '✦ 拖动移动';
                ctx.fillText(hintText, timePos.x - 10, timePos.y + fontSize + 8);
            }

            // 重置阴影
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            requestAnimationFrame(animate);
        }

        // ==================== 启动 ====================
        generateParticles();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
